name: Perl tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PDL
        run: |
          sudo apt-get update
          sudo apt-get install -y pdl

      - name: Show dependency versions
        run: |
          perl -V:version
          perl -MPDL -e 'print "PDL $PDL::VERSION\n"'

      - name: Run Perl tests
        run: prove -lv t
